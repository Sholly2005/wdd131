<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Emblem -->
    <linearGradient id="favGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f5182;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="favGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00a86b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20d394;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Rounded Badge -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#favGradPrimary)" />
  
  <!-- Financial Growth Chart Line -->
  <path d="M 20 70 L 40 55 L 58 63 L 80 30" fill="none" stroke="url(#favGradAccent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="80,30 66,32 78,44" fill="#00a86b" />

  <!-- Gold Dollar Symbol Badge -->
  <circle cx="28" cy="32" r="11" fill="#f4d35e" />
  <text x="28" y="36.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#0d3b66" text-anchor="middle">$</text>
</svg>
