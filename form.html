<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - WDD 131</title>
    <meta name="description" content="Product review form page for WDD 131 course, allowing users to submit feedback and rate products.">
    <meta name="author" content="Bamidele Olusola">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <fieldset>
                <legend>Product Details</legend>
                
                <label for="product-select">Product Name *</label>
                <select id="product-select" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <label>Overall Rating *</label>
                <div class="rating-group">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 stars">☆</label>

                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4" title="4 stars">☆</label>

                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3" title="3 stars">☆</label>

                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2" title="2 stars">☆</label>

                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1" title="1 star">☆</label>
                </div>

                <label for="install-date">Date of Installation *</label>
                <input type="date" id="install-date" name="installDate" required>
            </fieldset>

            <fieldset>
                <legend>Features & Feedback</legend>
                
                <p>Useful Features (Check all that apply):</p>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="feature-durability" name="features" value="durability">
                    <label for="feature-durability">Durability</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="feature-ease" name="features" value="easeOfUse">
                    <label for="feature-ease">Ease of Use</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="feature-performance" name="features" value="performance">
                    <label for="feature-performance">Performance</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="feature-design" name="features" value="design">
                    <label for="feature-design">Design</label>
                </div>

                <label for="written-review">Written Review (Optional)</label>
                <textarea id="written-review" name="writtenReview" rows="5" placeholder="Share your experience with the product..."></textarea>

                <label for="user-name">Your Name (Optional)</label>
                <input type="text" id="user-name" name="userName" placeholder="John Doe">
            </fieldset>

            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Bamidele Olusola | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
